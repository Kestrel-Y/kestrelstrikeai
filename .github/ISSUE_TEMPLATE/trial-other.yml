name: 其他角色试用申请
description: 其他身份申请部署试用
title: "试用申请 · 其他 · "
labels: ["trial", "other"]
body:
  - type: markdown
    attributes:
      value: |
        请说明你的身份与用途。审核通过后私下发放部署包与试用证书。
  - type: dropdown
    id: edition
    attributes:
      label: 期望授权版本
      options:
        - 试用版（默认）
        - 正式版咨询
        - 企业版咨询
      default: 0
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: 姓名 / 代号
    validations:
      required: true
  - type: input
    id: role_detail
    attributes:
      label: 身份说明
      placeholder: 例如：高校安全实验室、蓝队、产品评估…
    validations:
      required: true
  - type: input
    id: org
    attributes:
      label: 单位 / 组织（可选）
  - type: input
    id: contact
    attributes:
      label: 联系方式
      description: 邮箱 / 微信 / Telegram
    validations:
      required: true
  - type: input
    id: fingerprint
    attributes:
      label: 实例指纹 / 激活请求摘要（可选）
  - type: textarea
    id: purpose
    attributes:
      label: 用途说明
    validations:
      required: true
  - type: checkboxes
    id: authorize
    attributes:
      label: 授权承诺
      options:
        - label: 我确认仅在已获得目标系统权利人明确书面授权的场景使用，并同意站点免责声明与安全声明。
          required: true
